name: Daily Partyflock Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scraper uitvoeren
        run: python scraper.py

      - name: Wijzigingen committen en pushen naar repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Automated update: Partyflock events" || exit 0
          git pull --rebase origin main
          git push
